apiVersion: apps/v1
kind: Deployment
metadata:
  name: doom
  labels:
    app: doom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doom
  template:
    metadata:
      labels:
        app: doom
    spec:
      containers:
        - name: doom
          image: doom-web:freedoom-v2
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: doom
spec:
  selector:
    app: doom
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
